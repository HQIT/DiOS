server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-DiOS-Access-Token $http_x_dios_access_token;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "frame-ancestors https://www.demogo.work https://demogo.work" always;
    }
}
