[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dios-sdk"
version = "0.1.12"
description = "Versioned DiOS task and governed workload clients"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
acp = ["agent-client-protocol==1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
