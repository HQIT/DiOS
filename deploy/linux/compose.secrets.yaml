services:
  secret-agent:
    image: quay.io/openbao/openbao:2.7.3@sha256:ba4b133eb9586630024e71a617e66f37f29cc3534cdd46a6233e098ceded8dc9
    pull_policy: never
    user: ${DIOS_UID}:${DIOS_GID}
    command: [agent, "-config=${DIOS_ROOT}/config/openbao-agent.hcl"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${DIOS_ROOT}/config:${DIOS_ROOT}/config:ro
      - ${DIOS_ROOT}/secrets:${DIOS_ROOT}/secrets
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  backend:
    volumes:
      - ${DIOS_ROOT}/secrets:${DIOS_ROOT}/secrets:ro
