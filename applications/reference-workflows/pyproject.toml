[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-workflows"
version = "0.1.0"
description = "Synthetic reference workflows using public DiOS contracts"
requires-python = ">=3.11"
dependencies = ["dios-sdk>=0.1.19,<0.2", "knowledge-evidence==0.1.0"]

[project.scripts]
dios-reference-workflow = "dios_reference.app:main"

[tool.setuptools.packages.find]
where = ["src"]
