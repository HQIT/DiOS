[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "static-review"
version = "0.1.2"
description = "Static review reference application using public ACP clients"
requires-python = ">=3.11"
dependencies = ["dios-sdk[acp]>=0.1.3,<0.2"]

[project.scripts]
dios-review = "dios_review.app:main"
dios-cursor-review = "dios_review.cursor:main"
dios-dsh-review = "dios_review.dsh:main"

[tool.setuptools.packages.find]
where = ["src"]
