[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-evidence"
version = "0.1.0"
description = "Authorized source evidence reference workload"
requires-python = ">=3.11"
dependencies = ["dios-sdk>=0.1.0,<0.2"]

[project.scripts]
dios-evidence = "dios_evidence.app:main"

[tool.setuptools.packages.find]
where = ["src"]
