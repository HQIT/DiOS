[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dios-workforce-registry"
version = "0.5.0"
readme = "README.md"
description = "Independent workforce identity, template and governed publication registry"
requires-python = ">=3.11"
dependencies = ["dios-sdk>=0.1.22,<0.2", "packaging>=26,<27"]

[project.scripts]
dios-workforce = "dios_workforce.cli:main"
dios-workitem = "dios_workforce.work_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
