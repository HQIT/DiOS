name: dios-p32-experiment
x-limits: &limits
  cpus: 2
  mem_limit: 1g
  memswap_limit: 1g
  labels:
    dios.purpose: provider-evaluation-32
services:
  pg:
    <<: *limits
    image: postgres:16-alpine
    container_name: dios-p32-pg
    environment:
      POSTGRES_DB: p32
      POSTGRES_PASSWORD: ${P32_TEST_PASSWORD:?set an isolated test password}
    command: [postgres, -c, shared_buffers=256MB, -c, max_connections=80, -c, fsync=on, -c, synchronous_commit=on]
    ports: ["127.0.0.1:15440:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]
  mysql:
    <<: *limits
    image: mysql:8.0
    container_name: dios-p32-mysql
    environment:
      MYSQL_DATABASE: p32
      MYSQL_ROOT_PASSWORD: ${P32_TEST_PASSWORD:?set an isolated test password}
      MYSQL_ROOT_HOST: "%"
    command: [--innodb-buffer-pool-size=268435456, --innodb-flush-log-at-trx-commit=1, --sync-binlog=1, --max-connections=80]
    ports: ["127.0.0.1:15441:3306"]
    volumes: ["mysql:/var/lib/mysql"]
  etcd:
    <<: *limits
    image: quay.io/coreos/etcd:v3.6.5
    container_name: dios-p32-etcd
    command: [/usr/local/bin/etcd, --name=p32, --data-dir=/etcd-data, --listen-client-urls=http://0.0.0.0:2379, --advertise-client-urls=http://127.0.0.1:2379, --listen-peer-urls=http://127.0.0.1:2380, --initial-advertise-peer-urls=http://127.0.0.1:2380, --initial-cluster=p32=http://127.0.0.1:2380, --quota-backend-bytes=536870912]
    ports: ["127.0.0.1:15442:2379"]
    volumes: ["etcd:/etcd-data"]
  sqlite:
    <<: *limits
    image: dios-p32-embedded:experiment
    build:
      context: .
      dockerfile: Dockerfile.embedded
      args:
        BASE_IMAGE: ${P32_BASE_IMAGE:-dios-backend:local}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: dios-p32-sqlite
    command: [--kind, sqlite]
    ports: ["127.0.0.1:15443:4321"]
    volumes: ["sqlite:/data", "..:/experiment/experiments:ro"]
  lmdb:
    <<: *limits
    image: dios-p32-embedded:experiment
    container_name: dios-p32-lmdb
    command: [--kind, lmdb]
    ports: ["127.0.0.1:15444:4321"]
    volumes: ["lmdb:/data", "..:/experiment/experiments:ro"]
volumes:
  pg:
    name: dios-p32-pg-data
  mysql:
    name: dios-p32-mysql-data
  etcd:
    name: dios-p32-etcd-data
  sqlite:
    name: dios-p32-sqlite-data
  lmdb:
    name: dios-p32-lmdb-data
