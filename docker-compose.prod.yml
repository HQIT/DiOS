# 生产：本机端口 + 接入 demogo Caddy 网络
# backend 加入 demogo 网，以便 task/service Agent 容器经 DIOS_DOCKER_NETWORK 访问 git-perf 等
services:
  backend:
    ports:
      - "127.0.0.1:18080:8000"
    environment:
      - DIOS_ACCESS_TOKEN=${DIOS_ACCESS_TOKEN:-}
      - DIOS_DIAGENT_EVENT_GRANTS
      - DIOS_DOCKER_NETWORK=gdw-3d-bin-packing_default
      - DIOS_DIAGENT_IMAGE=${DIOS_DIAGENT_IMAGE:-dios-diagent-task:latest}
      - DIOS_DIAGENT_SERVICE_IMAGE=${DIOS_DIAGENT_SERVICE_IMAGE:-dios-diagent-service:latest}
      - DIOS_DIAGENT_SERVICE_MODEL_PROXY=${DIOS_DIAGENT_SERVICE_MODEL_PROXY:-false}
      - DIOS_DIAGENT_TASK_MODEL_PROXY=${DIOS_DIAGENT_TASK_MODEL_PROXY:-false}
      - DIOS_DIAGENT_TASK_MODEL_REFRESH=${DIOS_DIAGENT_TASK_MODEL_REFRESH:-false}
      - DIOS_DIAGENT_TASK_MODEL_ACCESS_TTL_SECONDS=${DIOS_DIAGENT_TASK_MODEL_ACCESS_TTL_SECONDS:-300}
      - DIOS_E2AG_INTERNAL_BASE_URL=${DIOS_E2AG_INTERNAL_BASE_URL:-http://backend:8000}
    networks:
      - default
      - demogo

  frontend:
    ports:
      - "127.0.0.1:13080:80"
    networks:
      - default
      - demogo

networks:
  demogo:
    external: true
    name: gdw-3d-bin-packing_default
