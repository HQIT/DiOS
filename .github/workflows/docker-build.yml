name: Build & Push Docker Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  delivery:
    uses: ./.github/workflows/delivery-ci.yml
    with:
      export_images: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read

  build-backend:
    needs: delivery
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: delivery-backend-${{ github.sha }}
          path: tested

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Publish the tested backend image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker load --input tested/backend.tar
          image=$(python -c 'import json; r=json.load(open("tested/summary.json")); assert r["passed"]; print(r["images"]["candidate"])')
          test "$(docker image inspect "$image" --format '{{.Id}}')" = "$image"
          while IFS= read -r tag; do
            docker tag "$image" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

  build-frontend:
    needs: delivery
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: delivery-frontend-${{ github.sha }}
          path: tested

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Publish the tested frontend image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker load --input tested/frontend.tar
          image=$(python -c 'import json; r=json.load(open("tested/summary.json")); assert r["passed"]; print(r["images"]["frontend"])')
          test "$(docker image inspect "$image" --format '{{.Id}}')" = "$image"
          while IFS= read -r tag; do
            docker tag "$image" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
