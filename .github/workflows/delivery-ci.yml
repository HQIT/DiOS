name: Linux delivery qualification

on:
  push:
    branches: [feat/lightweight-runtime-32]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'docs/design/fixtures/**'
      - '.github/workflows/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      export_images:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
        env:
          POSTGRES_PASSWORD: qualification-only
          POSTGRES_DB: dios
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U postgres -d dios"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install qualification dependencies
        run: pip install -r backend/requirements.txt
      - name: Qualify request cancellation and identity boundaries
        env:
          PYTHONPATH: backend:backend/tests
          DIOS_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:qualification-only@localhost:${{ job.services.postgres.ports[5432] }}/dios
        run: |
          python -m unittest -v test_runtime_database_cancellation
          python scripts/qualify_identity_access.py --local --output workspace/identity-access-ci
      - name: Build, install, run governed tasks, upgrade and roll back
        env:
          EXPORT_IMAGES: ${{ inputs.export_images }}
        run: |
          args=()
          if [ "$EXPORT_IMAGES" = true ]; then args+=(--export-images); fi
          python scripts/qualify_delivery.py --output "$RUNNER_TEMP/dios-delivery" "${args[@]}"
      - name: Qualify shared budget recovery with native Workers
        env:
          DIOS_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:qualification-only@localhost:${{ job.services.postgres.ports[5432] }}/dios
        run: |
          docker build -f examples/runtime/Dockerfile.fixture --build-arg BASE_IMAGE=dios-ci-candidate:${GITHUB_SHA:0:12} -t dios-worker-fixture:local examples/runtime
          python scripts/qualify_resource_recovery.py --local --postgres --output workspace/resource-recovery-ci
      - name: Retain tested backend image
        if: inputs.export_images
        uses: actions/upload-artifact@v4
        with:
          name: delivery-backend-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dios-delivery/backend.tar
            ${{ runner.temp }}/dios-delivery/summary.json
          compression-level: 0
          retention-days: 1
      - name: Retain tested frontend image
        if: inputs.export_images
        uses: actions/upload-artifact@v4
        with:
          name: delivery-frontend-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dios-delivery/frontend.tar
            ${{ runner.temp }}/dios-delivery/summary.json
          compression-level: 0
          retention-days: 1
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-delivery-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dios-delivery/summary.json
            ${{ runner.temp }}/dios-delivery/tests.log
            ${{ runner.temp }}/dios-delivery/qualification/result.json
            workspace/identity-access-ci/result.json
            workspace/resource-recovery-ci/result.json
            workspace/resource-recovery-ci/tests.log
          if-no-files-found: error
          retention-days: 14
