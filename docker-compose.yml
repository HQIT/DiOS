version: "3.8"

services:
  backend:
    image: ghcr.io/hqit/dios/backend:main
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspace:/workspace
      - dios-data:/data
    environment:
      - DIOS_WORKSPACE_ROOT=/workspace
      - DIOS_HOST_WORKSPACE_ROOT=${PWD}/workspace
      - DIOS_HOST_SHARED_CLI_ROOT=${PWD}/cli
      - DIOS_DATABASE_URL=sqlite+aiosqlite:////data/dios.db
      - DIOS_DIAGENT_IMAGE=${DIOS_DIAGENT_IMAGE:-ghcr.io/hqit/diagent/agent-task:latest}
      - DIOS_DIAGENT_SERVICE_IMAGE=${DIOS_DIAGENT_SERVICE_IMAGE:-dios-diagent-service:latest}
      - DIOS_DIAGENT_SERVICE_MODEL_PROXY=${DIOS_DIAGENT_SERVICE_MODEL_PROXY:-false}
      - DIOS_DIAGENT_TASK_MODEL_PROXY=${DIOS_DIAGENT_TASK_MODEL_PROXY:-false}
      - DIOS_DIAGENT_TASK_MODEL_REFRESH=${DIOS_DIAGENT_TASK_MODEL_REFRESH:-false}
      - DIOS_DIAGENT_TASK_MODEL_ACCESS_TTL_SECONDS=${DIOS_DIAGENT_TASK_MODEL_ACCESS_TTL_SECONDS:-300}
      - DIOS_E2AG_INTERNAL_BASE_URL=${DIOS_E2AG_INTERNAL_BASE_URL:-http://host.docker.internal:8000}
      - DIOS_ACCESS_TOKEN=${DIOS_ACCESS_TOKEN:-}
      - DIOS_DIAGENT_EVENT_GRANTS
    ports:
      - "8000:8000"

  frontend:
    image: ghcr.io/hqit/dios/frontend:main
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  dios-data:
