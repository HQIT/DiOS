services:
  # 仅构建 DiAgent service 镜像，不启动；Runtime Manager 动态管理容器
  diagent-build:
    build:
      context: ${DIAGENT_BUILD_CONTEXT:-../DiAgent-TS}
      dockerfile: docker/agent-task-dsh/Dockerfile
      target: service
    image: dios-diagent-service:dsh-dev
    profiles: ["build"]

  # task 模式镜像（含 git/curl），供一次性事件触发容器使用
  diagent-task-build:
    build:
      context: ${DIAGENT_BUILD_CONTEXT:-../DiAgent-TS}
      dockerfile: docker/agent-task-dsh/Dockerfile
      target: task
    image: dios-diagent-task:dsh-dev
    profiles: ["build"]

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/app
      - ./workspace:/workspace
      - dios-data:/data
    environment:
      - DIOS_WORKSPACE_ROOT=/workspace
      - DIOS_HOST_WORKSPACE_ROOT=${PWD}/workspace
      - DIOS_HOST_SHARED_CLI_ROOT=${PWD}/cli
      - DIOS_DATABASE_URL=sqlite+aiosqlite:////data/dios.db
      - DIOS_DIAGENT_IMAGE=dios-diagent-task:dsh-dev
      - DIOS_DIAGENT_SERVICE_IMAGE=dios-diagent-service:dsh-dev
      - DIOS_DIAGENT_SERVICE_MODEL_PROXY=${DIOS_DIAGENT_SERVICE_MODEL_PROXY:-false}
      - DIOS_DIAGENT_TASK_MODEL_PROXY=${DIOS_DIAGENT_TASK_MODEL_PROXY:-false}
      - DIOS_DIAGENT_TASK_MODEL_REFRESH=${DIOS_DIAGENT_TASK_MODEL_REFRESH:-false}
      - DIOS_DIAGENT_TASK_MODEL_ACCESS_TTL_SECONDS=${DIOS_DIAGENT_TASK_MODEL_ACCESS_TTL_SECONDS:-300}
      - DIOS_E2AG_INTERNAL_BASE_URL=${DIOS_E2AG_INTERNAL_BASE_URL:-http://backend:8000}
      - DIOS_DOCKER_NETWORK=${COMPOSE_PROJECT_NAME}_default
      # 避免 WSL/Cursor 代理劫持访问 dios-agent-* 容器
      - NO_PROXY=localhost,127.0.0.1,backend,172.16.0.0/12,10.0.0.0/8
      - no_proxy=localhost,127.0.0.1,backend,172.16.0.0/12,10.0.0.0/8
      - DIOS_ACCESS_TOKEN=${DIOS_ACCESS_TOKEN:-}
      - DIOS_DIAGENT_EVENT_GRANTS
    ports:
      - "8081:8000"  # 8080 常被其他服务占用，直连 API 用 8081

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    environment:
      - VITE_API_URL=http://backend:8000
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  dios-data:
