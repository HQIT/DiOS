<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" style="stop-color:#6c8eef;stop-opacity:0.45"/>
      <stop offset="70%" style="stop-color:#4ea8de;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#4ea8de;stop-opacity:0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#0f1117"/>

  <!-- ???? + ???? -->
  <circle cx="960" cy="440" r="300" fill="url(#glow)" filter="url(#soft)">
    <animate attributeName="r" values="285;315;285" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="960" cy="440" r="300" fill="none" stroke="#6c8eef" stroke-width="1" opacity="0.25">
    <animate attributeName="r" values="285;320;285" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <text x="960" y="480" text-anchor="middle" font-family="system-ui,sans-serif" font-size="140"
        font-weight="700" fill="#e4e6eb" letter-spacing="8" opacity="0">
    DiOS
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.2s" fill="freeze"/>
    <animate attributeName="letter-spacing" values="12;8;8" dur="0.9s" begin="0.2s" fill="freeze"/>
  </text>

  <text x="960" y="560" text-anchor="middle" font-family="system-ui,sans-serif" font-size="34"
        fill="#8b8fa3" opacity="0">
    Deep Intelligent Operation System
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.9s" fill="freeze"/>
  </text>

  <text x="960" y="640" text-anchor="middle" font-family="system-ui,sans-serif" font-size="42"
        fill="#6c8eef" opacity="0">
    Agent &#30340;&#25805;&#20316;&#31995;&#32479;
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.5s" fill="freeze"/>
  </text>
</svg>
