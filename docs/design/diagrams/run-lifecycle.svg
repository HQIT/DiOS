<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc"><title id="title">Run 状态与恢复</title><desc id="desc">排队、执行、校验、技术成功；结果未知先对账，证据不足等待验证。</desc><defs><marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#56748f"/></marker></defs><rect width="1280" height="680" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="28" font-weight="650" fill="#172d43">Run：运行终态由结果校验决定</text><text x="40" y="85" font-size="18" font-weight="400" fill="#172d43">主路径与恢复关系 · 完整状态及门槛由 states.json 定义</text><rect x="40" y="160" width="250" height="120" rx="10" fill="#edf3fa" stroke="#56748f"/><text x="58" y="198" font-size="23" font-weight="650" fill="#172d43">queued</text><text x="58" y="238" font-size="18" font-weight="400" fill="#172d43">等待授权与资源</text><rect x="355" y="160" width="250" height="120" rx="10" fill="#edf3fa" stroke="#56748f"/><text x="373" y="198" font-size="23" font-weight="650" fill="#172d43">executing</text><text x="373" y="238" font-size="18" font-weight="400" fill="#172d43">Attempt 持有租约</text><rect x="670" y="160" width="250" height="120" rx="10" fill="#edf3fa" stroke="#56748f"/><text x="688" y="198" font-size="23" font-weight="650" fill="#172d43">validating</text><text x="688" y="238" font-size="18" font-weight="400" fill="#172d43">完整性与必要证据</text><rect x="985" y="160" width="250" height="120" rx="10" fill="#edf3fa" stroke="#56748f"/><text x="1003" y="198" font-size="23" font-weight="650" fill="#172d43">succeeded</text><text x="1003" y="238" font-size="18" font-weight="400" fill="#172d43">技术验收通过</text><path d="M290 220 H355" fill="none" stroke="#56748f" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M605 220 H670" fill="none" stroke="#56748f" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M920 220 H985" fill="none" stroke="#56748f" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="40" y="450" width="250" height="120" rx="10" fill="#edf3fa" stroke="#56748f"/><text x="58" y="488" font-size="23" font-weight="650" fill="#172d43">retry_wait</text><text x="58" y="528" font-size="18" font-weight="400" fill="#172d43">旧尝试关闭、退避到期</text><rect x="355" y="450" width="250" height="120" rx="10" fill="#edf3fa" stroke="#56748f"/><text x="373" y="488" font-size="16" font-weight="650" fill="#172d43">reconciliation_required</text><text x="373" y="528" font-size="18" font-weight="400" fill="#172d43">外部结果待核对</text><rect x="670" y="450" width="250" height="120" rx="10" fill="#edf3fa" stroke="#56748f"/><text x="688" y="488" font-size="23" font-weight="650" fill="#172d43">needs_verification</text><text x="688" y="528" font-size="18" font-weight="400" fill="#172d43">等待补充证据</text><path d="M480 280 V450" fill="none" stroke="#56748f" stroke-width="2.2" marker-end="url(#arrow)"/><text x="495" y="370" font-size="18" font-weight="400" fill="#172d43">结果未知</text><path d="M355 510 H290" fill="none" stroke="#56748f" stroke-width="2.2" marker-end="url(#arrow)"/><text x="294" y="494" font-size="17" font-weight="400" fill="#172d43">已核对</text><path d="M165 450 V280" fill="none" stroke="#56748f" stroke-width="2.2" marker-end="url(#arrow)"/><text x="185" y="370" font-size="18" font-weight="400" fill="#172d43">允许重试</text><path d="M730 280 V450" fill="none" stroke="#56748f" stroke-width="2.2" marker-end="url(#arrow)"/><text x="742" y="410" font-size="18" font-weight="400" fill="#172d43">证据不足</text><path d="M880 450 V280" fill="none" stroke="#56748f" stroke-width="2.2" marker-end="url(#arrow)"/><text x="895" y="335" font-size="18" font-weight="400" fill="#172d43">补充校验</text><text x="40" y="635" font-size="21" font-weight="400" fill="#172d43">查询超时仅改变观测新鲜度；取消确认、失败与业务验收独立记录。</text></g></svg>
