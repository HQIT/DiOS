<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 680" role="img" aria-labelledby="title desc"><title id="title">授权与撤销的生命周期</title><desc id="desc">授权路径从准入到工作授权、执行 Grant 和动作决策；撤销路径从代次提交到缓存失效、执行阻断和确认。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#587282"/></marker></defs><rect width="1320" height="680" fill="white"/><text x="40" y="55" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="600" fill="#173348">授权持续收窄，动作始终绑定当前所有者</text><text x="40" y="120" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="600" fill="#173348">授权路径</text><rect x="40" y="145" width="280" height="150" rx="10" fill="#edf7f6" stroke="#b7cbd2"/><text x="58" y="185" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="600" fill="#173348">一次准入</text><text x="58" y="225" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#173348">900 秒内兑换</text><text x="58" y="261" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#173348">同事务创建 Run</text><path d="M320 220 H352" stroke="#587282" stroke-width="2" marker-end="url(#arrow)"/><rect x="360" y="145" width="280" height="150" rx="10" fill="#edf7f6" stroke="#b7cbd2"/><text x="378" y="185" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="600" fill="#173348">工作授权</text><text x="378" y="225" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#173348">默认截止 24 小时</text><text x="378" y="261" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#173348">保留委托与预算</text><path d="M640 220 H672" stroke="#587282" stroke-width="2" marker-end="url(#arrow)"/><rect x="680" y="145" width="280" height="150" rx="10" fill="#edf7f6" stroke="#b7cbd2"/><text x="698" y="185" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="600" fill="#173348">执行 Grant</text><text x="698" y="225" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#173348">900 秒 / 300 秒续期</text><text x="698" y="261" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#173348">绑定会话和租约</text><path d="M960 220 H992" stroke="#587282" stroke-width="2" marker-end="url(#arrow)"/><rect x="1000" y="145" width="280" height="150" rx="10" fill="#edf7f6" stroke="#b7cbd2"/><text x="1018" y="185" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="600" fill="#173348">动作决策</text><text x="1018" y="225" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#173348">参数、范围与审批</text><text x="1018" y="261" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#173348">持久意图后派发</text><text x="40" y="390" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="600" fill="#173348">撤销路径</text><rect x="40" y="415" width="280" height="150" rx="10" fill="#f5f1ec" stroke="#b7cbd2"/><text x="58" y="455" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="600" fill="#173348">提交撤销</text><text x="58" y="495" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#173348">递增授权代次</text><text x="58" y="531" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#173348">记录生效截止时间</text><path d="M320 490 H352" stroke="#587282" stroke-width="2" marker-end="url(#arrow)"/><rect x="360" y="415" width="280" height="150" rx="10" fill="#f5f1ec" stroke="#b7cbd2"/><text x="378" y="455" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="600" fill="#173348">失效传播</text><text x="378" y="495" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#173348">缓存最长 2 秒</text><text x="378" y="531" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#173348">派发核验当前代次</text><path d="M640 490 H672" stroke="#587282" stroke-width="2" marker-end="url(#arrow)"/><rect x="680" y="415" width="280" height="150" rx="10" fill="#f5f1ec" stroke="#b7cbd2"/><text x="698" y="455" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="600" fill="#173348">执行阻断</text><text x="698" y="495" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#173348">停止新动作</text><text x="698" y="531" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#173348">取消与对账在途动作</text><path d="M960 490 H992" stroke="#587282" stroke-width="2" marker-end="url(#arrow)"/><rect x="1000" y="415" width="280" height="150" rx="10" fill="#f5f1ec" stroke="#b7cbd2"/><text x="1018" y="455" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="600" fill="#173348">控制点确认</text><text x="1018" y="495" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#173348">生效目标 P99 ≤ 5 秒</text><text x="1018" y="531" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#173348">远端确认独立记录</text><text x="40" y="345" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" fill="#173348">权限变化重新校验；新 Attempt、Session 或 epoch 使用新 Grant。</text><text x="40" y="630" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" fill="#173348">已派发动作保留现场和结果身份；未确认控制点阻断新动作。</text></svg>
