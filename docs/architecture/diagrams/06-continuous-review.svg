<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">持续代码评审与 DiOS 分层</title><desc id="desc">评审应用定义范围和成果，工作服务组织责任与视图，运行内核负责持久执行。协议适配连接独立智能体，事件和产物进入统一查询。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#537485" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#19364a}.title{font-size:28px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#496777}.line{stroke:#537485;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<rect width="1200" height="850" fill="#fff"/>
<text x="42" y="48" class="title">持续评审：业务定义成果，DiOS 保证受控运行</text>
<rect x="40" y="82" width="1120" height="130" rx="12" fill="#eaf4f2" stroke="#9fc8bf"/>
<text x="64" y="119" class="head">L3 · 评审应用</text>
<text x="64" y="155" class="body">仓库与分支范围 → 固定 SHA → 基线 / 增量 → 证据与覆盖账本</text>
<text x="64" y="187" class="small">Codeup / GitHub 适配 · 上下文复用 · 缺陷评测 · 问题聚合 · 统一筛选与报告</text>
<path d="M400 212 V240" class="line"/>
<rect x="40" y="244" width="1120" height="105" rx="12" fill="#edf3fb" stroke="#afc5de"/>
<text x="64" y="281" class="head">L2 · 工作与管理服务</text>
<text x="64" y="319" class="body">组织 / 员工 / 工作空间 · 工作项与人工验证 · 授权查询与运营视图</text>
<path d="M400 349 V377" class="line"/>
<rect x="40" y="381" width="780" height="174" rx="12" fill="#edf3f6" stroke="#a9c1ce"/>
<text x="64" y="419" class="head">L1 · DiOS 运行与治理内核</text>
<text x="64" y="456" class="body">持久调度 · Run / Attempt · 租约与所有权 · 恢复与排空</text>
<text x="64" y="491" class="body">Worker 监督 · 资源限制 · 身份 / 凭据 · 工具控制点</text>
<text x="64" y="526" class="small">协议 Adapter 与进程 / 容器生命周期 Adapter 分离</text>
<rect x="858" y="381" width="302" height="174" rx="12" fill="#fff7e8" stroke="#d8c092"/>
<text x="879" y="421" class="head">事件、产物与查询</text>
<text x="879" y="459" class="body">小事件 / outbox / 水位</text>
<text x="879" y="493" class="body">不可变产物 / 校验 / ACL</text>
<text x="879" y="527" class="body">进度与详情独立同步</text>
<path d="M820 468 H852" class="line"/><path d="M1008 381 V355" class="line"/>
<path d="M400 555 V599" class="line"/>
<rect x="40" y="605" width="1120" height="153" rx="12" fill="#f6effa" stroke="#c6b6d8"/>
<text x="64" y="644" class="head">独立 Agent / Harness · ACP / A2A / 厂商接口</text>
<text x="64" y="684" class="body">DiAgent　　Cursor　　DeepSeek Harness　　Codex　　Claude Agent　　其他实现</text>
<text x="64" y="721" class="small">Agent 提供推理与工具循环；控制能力按版本和实际执行边界验证</text>
<text x="42" y="807" class="body">接入顺序：只读观察 → 隔离验证 → 活跃任务排空 → 单分区切换 → 扩大接管</text>
</svg>
