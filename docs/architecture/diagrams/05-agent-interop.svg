<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1030" role="img" aria-labelledby="title desc">
<title id="title">智能体接入：治理与 loop / harness 分离</title><desc id="desc">目标架构 · 上方为 DiOS 责任域，下方为智能体执行域；箭头表示适配调用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="9" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#56748f"/></marker></defs>
<rect width="1280" height="1030" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="40" y="46" font-size="28" font-weight="700" fill="#172d43">智能体接入：治理与 loop / harness 分离</text><text x="40" y="79" font-size="18" font-weight="400" fill="#476078">目标架构 · 上方为 DiOS 责任域，下方为智能体执行域；箭头表示适配调用。</text><rect x="40" y="120" width="1200" height="400" rx="10" fill="#edf3fa" stroke="#56748f" stroke-width="1.5"/><text x="62" y="156" font-size="26" font-weight="650" fill="#172d43">L1 · DiOS 运行治理与智能体接入</text><rect x="70" y="195" width="1140" height="95" rx="10" fill="#ffffff" stroke="#56748f" stroke-width="1.5"/><text x="92" y="231" font-size="23" font-weight="650" fill="#172d43">统一接入契约</text><text x="92" y="264" font-size="19" font-weight="400" fill="#476078">身份与策略 / 能力声明 / Run ↔ Task、Session / 状态与产物 / 审计与用量</text><rect x="70" y="365" width="320" height="110" rx="10" fill="#ffffff" stroke="#56748f" stroke-width="1.5"/><text x="92" y="401" font-size="23" font-weight="650" fill="#172d43">A2A Adapter</text><text x="92" y="434" font-size="19" font-weight="400" fill="#476078">发现与任务委派</text><rect x="480" y="365" width="320" height="110" rx="10" fill="#ffffff" stroke="#56748f" stroke-width="1.5"/><text x="502" y="401" font-size="23" font-weight="650" fill="#172d43">ACP Client / Adapter</text><text x="502" y="434" font-size="19" font-weight="400" fill="#476078">交互会话与权限请求</text><rect x="890" y="365" width="320" height="110" rx="10" fill="#ffffff" stroke="#56748f" stroke-width="1.5"/><text x="912" y="401" font-size="23" font-weight="650" fill="#172d43">厂商 Adapter</text><text x="912" y="434" font-size="19" font-weight="400" fill="#476078">SDK / API / CLI 映射</text><path d="M230 290 V365" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M640 290 V365" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1050 290 V365" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="655" width="1200" height="180" rx="10" fill="#edf5f4" stroke="#56748f" stroke-width="1.5"/><text x="62" y="691" font-size="25" font-weight="650" fill="#172d43">Agent 自身的 loop / harness</text><text x="62" y="724" font-size="19" font-weight="400" fill="#476078">DiAgent / DeepSeek Harness（dsh）/ Cursor / Codex / Claude Code（CC）/ 其他 Agent</text><text x="62" y="753" font-size="19" font-weight="400" fill="#476078">推理与规划 · 上下文与会话 · 工具调用循环 · Agent 内部扩展</text><text x="62" y="782" font-size="19" font-weight="400" fill="#476078">候选目标按实际接口选择接入路径；每个实现独立声明协议、版本与治理能力。</text><path d="M230 475 V655" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M640 475 V655" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1050 475 V655" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="70" y="573" font-size="19" font-weight="500" fill="#172d43">Agent2Agent</text><text x="660" y="573" font-size="19" font-weight="500" fill="#172d43">Agent Client Protocol</text><text x="910" y="573" font-size="19" font-weight="500" fill="#172d43">实现专属接口</text><text x="40" y="895" font-size="21" font-weight="600" fill="#172d43">托管执行：Runtime Adapter 管生命周期，网关 / 沙箱 / 执行钩子落实动作约束。</text><text x="40" y="940" font-size="21" font-weight="600" fill="#172d43">远端委派：DiOS 管入口授权、数据外发与结果；内部动作控制按端点能力验证。</text><text x="40" y="985" font-size="20" font-weight="400" fill="#172d43">接入协议与可控制范围分别登记。MCP 提供工具与数据，A2A / ACP 连接智能体。</text></g></svg>
