<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">对象归属：数字员工持续存在，运行按需发生</title><desc id="desc">目标概念模型 · 箭头表示引用或派生关系；跨层保存标识，通过契约查询。</desc>
<defs><marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="9" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#56748f"/></marker></defs>
<rect width="1280" height="820" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="40" y="46" font-size="28" font-weight="700" fill="#172d43">对象归属：数字员工持续存在，运行按需发生</text><text x="40" y="79" font-size="18" font-weight="400" fill="#476078">目标概念模型 · 箭头表示引用或派生关系；跨层保存标识，通过契约查询。</text><text x="62" y="130" font-size="25" font-weight="650" fill="#172d43">L2 · 长期身份与工作</text><text x="722" y="130" font-size="25" font-weight="650" fill="#172d43">L1 · 技术运行与证据</text><rect x="40" y="160" width="500" height="120" rx="10" fill="#edf5f4" stroke="#56748f" stroke-width="1.5"/><text x="62" y="196" font-size="22" font-weight="650" fill="#172d43">DigitalEmployee</text><text x="62" y="229" font-size="19" font-weight="400" fill="#476078">长期身份、岗位与职责</text><rect x="700" y="160" width="540" height="120" rx="10" fill="#edf3fa" stroke="#56748f" stroke-width="1.5"/><text x="722" y="196" font-size="22" font-weight="650" fill="#172d43">AgentDefinition / Deployment</text><text x="722" y="229" font-size="19" font-weight="400" fill="#476078">部署引用固定 Revision</text><rect x="40" y="380" width="500" height="120" rx="10" fill="#edf5f4" stroke="#56748f" stroke-width="1.5"/><text x="62" y="416" font-size="22" font-weight="650" fill="#172d43">WorkItem</text><text x="62" y="449" font-size="19" font-weight="400" fill="#476078">分派、协作、复核与业务关闭</text><rect x="700" y="380" width="540" height="120" rx="10" fill="#edf3fa" stroke="#56748f" stroke-width="1.5"/><text x="722" y="416" font-size="22" font-weight="650" fill="#172d43">Run</text><text x="722" y="449" font-size="19" font-weight="400" fill="#476078">排队、执行、重试与技术终态</text><rect x="40" y="600" width="500" height="120" rx="10" fill="#edf5f4" stroke="#56748f" stroke-width="1.5"/><text x="62" y="636" font-size="22" font-weight="650" fill="#172d43">Workspace</text><text x="62" y="669" font-size="19" font-weight="400" fill="#476078">共享文件、会话、成果可见性与保留</text><rect x="700" y="600" width="540" height="120" rx="10" fill="#edf3fa" stroke="#56748f" stroke-width="1.5"/><text x="722" y="636" font-size="22" font-weight="650" fill="#172d43">Artifact</text><text x="722" y="669" font-size="19" font-weight="400" fill="#476078">产物引用、版本摘要与运行关联</text><path d="M540 218 H700" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="563" y="200" font-size="18" font-weight="500" fill="#476078">绑定 1 : N</text><path d="M540 438 H700" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="563" y="420" font-size="18" font-weight="500" fill="#476078">关联 1 : N</text><path d="M700 658 H540" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="572" y="640" font-size="18" font-weight="500" fill="#476078">发布引用</text><path d="M970 280 V380" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="990" y="338" font-size="18" font-weight="500" fill="#476078">派生运行 1 : N</text><path d="M970 500 V600" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="990" y="558" font-size="18" font-weight="500" fill="#476078">形成 1 : N</text><path d="M290 280 V380" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="310" y="338" font-size="18" font-weight="500" fill="#476078">参与工作</text><path d="M290 500 V600" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="310" y="558" font-size="18" font-weight="500" fill="#476078">工作上下文</text><text x="40" y="780" font-size="20" font-weight="400" fill="#172d43">Run 可独立于 WorkItem 存在；业务验收由 L2 决定。具体基数与状态机由领域设计固定。</text></g></svg>
