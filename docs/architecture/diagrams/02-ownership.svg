<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1050" role="img" aria-labelledby="title desc">
<title id="title">对象归属：身份、逻辑运行与执行尝试分别记录</title><desc id="desc">目标概念模型 · 连线表示引用或派生；最终 Schema 与状态机由 #25 固定。</desc>
<defs><marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="9" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#56748f"/></marker></defs>
<rect width="1280" height="1050" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="40" y="46" font-size="28" font-weight="700" fill="#172d43">对象归属：身份、逻辑运行与执行尝试分别记录</text><text x="40" y="79" font-size="18" font-weight="400" fill="#476078">目标概念模型 · 连线表示引用或派生；最终 Schema 与状态机由 #25 固定。</text><text x="62" y="130" font-size="25" font-weight="650" fill="#172d43">L2 · 长期身份与工作</text><text x="722" y="130" font-size="25" font-weight="650" fill="#172d43">L1 · 技术运行与证据</text><rect x="40" y="160" width="500" height="120" rx="10" fill="#edf5f4" stroke="#56748f" stroke-width="1.5"/><text x="62" y="196" font-size="22" font-weight="650" fill="#172d43">DigitalEmployee</text><text x="62" y="229" font-size="19" font-weight="400" fill="#476078">长期身份、岗位与职责</text><rect x="700" y="160" width="540" height="120" rx="10" fill="#edf3fa" stroke="#56748f" stroke-width="1.5"/><text x="722" y="196" font-size="22" font-weight="650" fill="#172d43">AgentDefinition / Deployment</text><text x="722" y="229" font-size="19" font-weight="400" fill="#476078">部署引用固定 Revision</text><rect x="40" y="380" width="500" height="120" rx="10" fill="#edf5f4" stroke="#56748f" stroke-width="1.5"/><text x="62" y="416" font-size="22" font-weight="650" fill="#172d43">WorkItem</text><text x="62" y="449" font-size="19" font-weight="400" fill="#476078">分派、协作、复核与业务关闭</text><rect x="700" y="380" width="540" height="120" rx="10" fill="#edf3fa" stroke="#56748f" stroke-width="1.5"/><text x="722" y="416" font-size="22" font-weight="650" fill="#172d43">Run · 逻辑运行</text><text x="722" y="449" font-size="19" font-weight="400" fill="#476078">分工与业务修订可创建不同 Run</text><rect x="700" y="600" width="540" height="145" rx="10" fill="#edf3fa" stroke="#56748f" stroke-width="1.5"/><text x="722" y="636" font-size="22" font-weight="650" fill="#172d43">Attempt · 执行尝试</text><text x="722" y="669" font-size="19" font-weight="400" fill="#476078">重试保留 Run，创建新 Attempt</text><text x="722" y="698" font-size="19" font-weight="400" fill="#476078">关联 Worker、Process、Session 与租约</text><rect x="40" y="840" width="500" height="120" rx="10" fill="#edf5f4" stroke="#56748f" stroke-width="1.5"/><text x="62" y="876" font-size="22" font-weight="650" fill="#172d43">Workspace</text><text x="62" y="909" font-size="19" font-weight="400" fill="#476078">共享文件、会话、成果可见性与保留</text><rect x="700" y="840" width="540" height="120" rx="10" fill="#edf3fa" stroke="#56748f" stroke-width="1.5"/><text x="722" y="876" font-size="22" font-weight="650" fill="#172d43">Artifact</text><text x="722" y="909" font-size="19" font-weight="400" fill="#476078">内容摘要、校验结果与执行关联</text><path d="M540 218 H700" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="563" y="200" font-size="18" font-weight="500" fill="#476078">绑定 1 : N</text><path d="M540 438 H700" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="563" y="420" font-size="18" font-weight="500" fill="#476078">关联 1 : N</text><path d="M700 898 H540" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="572" y="880" font-size="18" font-weight="500" fill="#476078">发布引用</text><path d="M970 280 V380" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="990" y="338" font-size="18" font-weight="500" fill="#476078">派生 1 : N</text><path d="M970 500 V600" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="990" y="558" font-size="18" font-weight="500" fill="#476078">尝试 1 : N</text><path d="M970 745 V840" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="990" y="800" font-size="18" font-weight="500" fill="#476078">形成 1 : N</text><path d="M290 280 V380" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="310" y="338" font-size="18" font-weight="500" fill="#476078">参与工作</text><path d="M290 500 V840" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="310" y="690" font-size="18" font-weight="500" fill="#476078">工作上下文</text><text x="40" y="1015" font-size="20" font-weight="400" fill="#172d43">Run 可独立于 WorkItem 存在；L1 校验运行结果，L2/L3 组织业务验收。</text></g></svg>
