<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1100" role="img" aria-labelledby="title desc">
<title id="title">三层结构与开放智能体生态</title><desc id="desc">目标架构 · 框表示责任域；箭头表示契约调用或标注的状态反馈。</desc>
<defs><marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="9" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#56748f"/></marker></defs>
<rect width="1280" height="1100" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="40" y="46" font-size="28" font-weight="700" fill="#172d43">三层结构与开放智能体生态</text><text x="40" y="79" font-size="18" font-weight="400" fill="#476078">目标架构 · 框表示责任域；箭头表示契约调用或标注的状态反馈。</text><rect x="40" y="120" width="850" height="160" rx="10" fill="#f8fafc" stroke="#56748f" stroke-width="1.5"/><text x="62" y="156" font-size="25" font-weight="650" fill="#172d43">L3 · 开放业务应用</text><text x="62" y="189" font-size="19" font-weight="400" fill="#476078">业务工作台 / 行业流程 / 模板 / 业务指标</text><text x="62" y="218" font-size="19" font-weight="400" fill="#476078">拥有：场景配置与业务对象映射</text><rect x="40" y="355" width="850" height="170" rx="10" fill="#edf5f4" stroke="#56748f" stroke-width="1.5"/><text x="62" y="391" font-size="25" font-weight="650" fill="#172d43">L2 · 数字员工管理与服务</text><text x="62" y="424" font-size="19" font-weight="400" fill="#476078">组织与身份 / 数字员工 / Workspace / WorkItem / 知识 / Studio</text><text x="62" y="453" font-size="19" font-weight="400" fill="#476078">拥有：长期身份、业务协作、对象 ACL、发布与运营记录</text><rect x="40" y="605" width="850" height="170" rx="10" fill="#edf3fa" stroke="#56748f" stroke-width="1.5"/><text x="62" y="641" font-size="25" font-weight="650" fill="#172d43">L1 · DiOS 内核</text><text x="62" y="674" font-size="19" font-weight="400" fill="#476078">资源 / 调度 / Runtime / 执行授权 / 审批门禁 / 审计与恢复</text><text x="62" y="703" font-size="19" font-weight="400" fill="#476078">拥有：Revision、Deployment、Run、资源策略与执行证据</text><path d="M300 280 V355" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="320" y="325" font-size="18" font-weight="500" fill="#476078">服务契约</text><path d="M780 355 V280" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="670" y="325" font-size="18" font-weight="500" fill="#476078">工作状态</text><path d="M300 525 V605" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="320" y="574" font-size="18" font-weight="500" fill="#476078">受控调用</text><path d="M780 605 V525" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="630" y="574" font-size="18" font-weight="500" fill="#476078">运行与证据事件</text><rect x="1010" y="145" width="230" height="120" rx="10" fill="#f1f6fa" stroke="#56748f" stroke-width="1.5"/><text x="1032" y="181" font-size="22" font-weight="650" fill="#172d43">业务系统</text><text x="1032" y="214" font-size="19" font-weight="400" fill="#476078">CRM / ERP / 教学</text><text x="1032" y="243" font-size="19" font-weight="400" fill="#476078">主数据与事务</text><rect x="1010" y="355" width="230" height="90" rx="10" fill="#f1f6fa" stroke="#56748f" stroke-width="1.5"/><text x="1032" y="391" font-size="22" font-weight="650" fill="#172d43">企业身份源</text><text x="1032" y="424" font-size="19" font-weight="400" fill="#476078">SSO / 目录</text><rect x="1010" y="470" width="230" height="90" rx="10" fill="#f1f6fa" stroke="#56748f" stroke-width="1.5"/><text x="1032" y="506" font-size="22" font-weight="650" fill="#172d43">知识 Provider</text><text x="1032" y="539" font-size="19" font-weight="400" fill="#476078">源数据 ACL</text><rect x="1010" y="635" width="230" height="120" rx="10" fill="#f1f6fa" stroke="#56748f" stroke-width="1.5"/><text x="1032" y="671" font-size="22" font-weight="650" fill="#172d43">模型与工具</text><text x="1032" y="704" font-size="19" font-weight="400" fill="#476078">模型 / MCP 等</text><text x="1032" y="733" font-size="19" font-weight="400" fill="#476078">外部动作与结果</text><path d="M890 200 H1010" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="920" y="187" font-size="18" font-weight="500" fill="#476078">适配</text><path d="M890 400 H1010" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="920" y="387" font-size="18" font-weight="500" fill="#476078">身份</text><path d="M890 495 H1010" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="920" y="482" font-size="18" font-weight="500" fill="#476078">检索</text><path d="M890 690 H1010" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="920" y="677" font-size="18" font-weight="500" fill="#476078">调用</text><path d="M300 775 V865" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="320" y="830" font-size="18" font-weight="500" fill="#476078">任务 / 会话</text><path d="M780 865 V775" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="590" y="830" font-size="18" font-weight="500" fill="#476078">状态 / 产物 / 证据</text><rect x="40" y="865" width="1200" height="150" rx="10" fill="#f8fafc" stroke="#56748f" stroke-width="1.5"/><text x="62" y="901" font-size="24" font-weight="650" fill="#172d43">开放执行生态 · 通过 L1 协议 Adapter 接入</text><text x="62" y="934" font-size="19" font-weight="400" fill="#476078">A2A · 任务委派     ACP（Agent Client Protocol）· 交互会话     厂商 SDK / API / CLI 适配</text><text x="62" y="963" font-size="19" font-weight="400" fill="#476078">DiAgent / DeepSeek Harness（dsh）/ Cursor / Codex / Claude Code（CC）/ 其他 Agent</text><text x="40" y="1060" font-size="20" font-weight="400" fill="#172d43">Agent 自身提供 loop / harness；接入能力与治理范围逐项验证。Console、CLI 为 L1 运维入口。</text></g></svg>
