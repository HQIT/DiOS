<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
<title id="title">E2AG：策略决策、实际控制点与运行证据</title><desc id="desc">目标控制结构 · L2 提供组织授权与审批规则；L1 执行约束，Agent 提供 loop / harness。</desc>
<defs><marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="9" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#56748f"/></marker></defs>
<rect width="1280" height="960" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="40" y="46" font-size="28" font-weight="700" fill="#172d43">E2AG：策略决策、实际控制点与运行证据</text><text x="40" y="79" font-size="18" font-weight="400" fill="#476078">目标控制结构 · L2 提供组织授权与审批规则；L1 执行约束，Agent 提供 loop / harness。</text><rect x="40" y="125" width="1200" height="125" rx="10" fill="#edf5f4" stroke="#56748f" stroke-width="1.5"/><text x="62" y="161" font-size="25" font-weight="650" fill="#172d43">Agent / Harness 与接入 Adapter</text><text x="62" y="194" font-size="19" font-weight="400" fill="#476078">携带主体、Run / Attempt / Session、资源与动作参数；原生工具及 MCP 按控制点接入</text><rect x="40" y="335" width="700" height="180" rx="10" fill="#edf3fa" stroke="#56748f" stroke-width="1.5"/><text x="62" y="371" font-size="25" font-weight="650" fill="#172d43">PEP · E2AG 执行控制点</text><text x="62" y="404" font-size="19" font-weight="400" fill="#476078">MCP 网关 / 原生工具沙箱 / 可信执行钩子</text><text x="62" y="433" font-size="19" font-weight="400" fill="#476078">允许、拒绝或阻止等待审批</text><text x="62" y="462" font-size="19" font-weight="400" fill="#476078">动作前保存意图；限制凭据、挂载与网络</text><rect x="835" y="335" width="405" height="180" rx="10" fill="#faf7ef" stroke="#56748f" stroke-width="1.5"/><text x="857" y="371" font-size="24" font-weight="650" fill="#172d43">PDP · E2AG 策略决策</text><text x="857" y="404" font-size="19" font-weight="400" fill="#476078">主体与委派权限交集</text><text x="857" y="433" font-size="19" font-weight="400" fill="#476078">策略版本、epoch、参数与有效期</text><text x="857" y="462" font-size="19" font-weight="400" fill="#476078">审批、续期与撤销</text><path d="M390 250 V335" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="410" y="300" font-size="18" font-weight="500" fill="#476078">动作请求</text><path d="M740 400 H835" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="763" y="385" font-size="18" font-weight="500" fill="#476078">请求</text><path d="M835 475 H740" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="763" y="460" font-size="18" font-weight="500" fill="#476078">决议</text><rect x="40" y="680" width="700" height="125" rx="10" fill="#f8fafc" stroke="#56748f" stroke-width="1.5"/><text x="62" y="716" font-size="25" font-weight="650" fill="#172d43">工具与资源</text><text x="62" y="749" font-size="19" font-weight="400" fill="#476078">文件 / Shell / 网络 / MCP 工具 / 业务系统</text><rect x="835" y="680" width="405" height="125" rx="10" fill="#f8fafc" stroke="#56748f" stroke-width="1.5"/><text x="857" y="716" font-size="24" font-weight="650" fill="#172d43">运行证据</text><text x="857" y="749" font-size="19" font-weight="400" fill="#476078">决议、意图、结果与校验</text><text x="857" y="778" font-size="19" font-weight="400" fill="#476078">关联运行、主体、版本与产物</text><path d="M390 515 V680" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="410" y="610" font-size="18" font-weight="500" fill="#476078">允许后执行</text><path d="M690 515 V595 H1035 V680" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="765" y="579" font-size="18" font-weight="500" fill="#476078">控制证据</text><path d="M740 745 H835" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="763" y="729" font-size="18" font-weight="500" fill="#476078">结果</text><text x="40" y="870" font-size="22" font-weight="600" fill="#172d43">扩展方向：原生工具控制、长任务续期、委派约束、远端治理与性能提升。</text><text x="40" y="915" font-size="20" font-weight="400" fill="#172d43">准入依据：实际拒绝 / 审批 / 撤销 / 恢复证据；能力缺口进入对应实现与联合验收。</text></g></svg>
