<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 845" role="img" aria-labelledby="title desc">
<title id="title">受管执行：在实际控制点实施授权</title><desc id="desc">目标流程 · 适用于已接入工具网关、沙箱或执行钩子的 Agent；远端委派按能力治理。</desc>
<defs><marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="9" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#56748f"/></marker></defs>
<rect width="1280" height="845" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="40" y="46" font-size="28" font-weight="700" fill="#172d43">受管执行：在实际控制点实施授权</text><text x="40" y="79" font-size="18" font-weight="400" fill="#476078">目标流程 · 适用于已接入工具网关、沙箱或执行钩子的 Agent；远端委派按能力治理。</text><rect x="40" y="125" width="330" height="135" rx="10" fill="#edf5f4" stroke="#56748f" stroke-width="1.5"/><text x="62" y="161" font-size="22" font-weight="650" fill="#172d43">① L2 创建工作</text><text x="62" y="194" font-size="19" font-weight="400" fill="#476078">验证身份与对象 ACL</text><text x="62" y="223" font-size="19" font-weight="400" fill="#476078">形成受限代理请求</text><rect x="475" y="125" width="330" height="135" rx="10" fill="#edf3fa" stroke="#56748f" stroke-width="1.5"/><text x="497" y="161" font-size="22" font-weight="650" fill="#172d43">② L1 创建并调度 Run</text><text x="497" y="194" font-size="19" font-weight="400" fill="#476078">验证代理链与资源范围</text><text x="497" y="223" font-size="19" font-weight="400" fill="#476078">Attempt、Worker 租约</text><rect x="910" y="125" width="330" height="135" rx="10" fill="#edf3fa" stroke="#56748f" stroke-width="1.5"/><text x="932" y="161" font-size="22" font-weight="650" fill="#172d43">③ E2AG 决策与控制</text><text x="932" y="194" font-size="19" font-weight="400" fill="#476078">权限 / 策略 / 预算 / 审批</text><text x="932" y="223" font-size="19" font-weight="400" fill="#476078">绑定动作、参数与有效期</text><path d="M370 190 H475" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M805 190 H910" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="430" width="330" height="145" rx="10" fill="#fbf5f4" stroke="#56748f" stroke-width="1.5"/><text x="62" y="466" font-size="22" font-weight="650" fill="#172d43">拒绝</text><text x="62" y="499" font-size="19" font-weight="400" fill="#476078">返回明确原因与证据</text><text x="62" y="528" font-size="19" font-weight="400" fill="#476078">L2 处理失败或人工接管</text><rect x="475" y="430" width="330" height="145" rx="10" fill="#faf7ef" stroke="#56748f" stroke-width="1.5"/><text x="497" y="466" font-size="22" font-weight="650" fill="#172d43">等待审批</text><text x="497" y="499" font-size="19" font-weight="400" fill="#476078">L2 选择审批人并形成决议</text><text x="497" y="528" font-size="19" font-weight="400" fill="#476078">批准后返回③，重新校验</text><rect x="910" y="430" width="330" height="145" rx="10" fill="#edf3fa" stroke="#56748f" stroke-width="1.5"/><text x="932" y="466" font-size="22" font-weight="650" fill="#172d43">④ 执行工具并留证</text><text x="932" y="499" font-size="19" font-weight="400" fill="#476078">使用受限凭据与资源</text><text x="932" y="528" font-size="19" font-weight="400" fill="#476078">保存结果、产物与审计</text><path d="M955 260 V310 Q955 320 945 320 H215 Q205 320 205 330 V430" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="215" y="366" font-size="18" font-weight="500" fill="#476078">拒绝</text><path d="M1015 260 V365 Q1015 375 1005 375 H650 Q640 375 640 385 V430" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="660" y="402" font-size="18" font-weight="500" fill="#476078">需审批</text><path d="M1140 260 V430" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1157" y="350" font-size="18" font-weight="500" fill="#476078">允许</text><rect x="910" y="670" width="330" height="130" rx="10" fill="#edf5f4" stroke="#56748f" stroke-width="1.5"/><text x="932" y="706" font-size="22" font-weight="650" fill="#172d43">⑤ L2 业务复核</text><text x="932" y="739" font-size="19" font-weight="400" fill="#476078">接受、修订或人工接管</text><text x="932" y="768" font-size="19" font-weight="400" fill="#476078">按业务规则关闭 WorkItem</text><path d="M1075 575 V670" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1090" y="631" font-size="18" font-weight="500" fill="#476078">运行结果</text><text x="40" y="650" font-size="22" font-weight="650" fill="#172d43">权限撤销或参数变化：后续动作重新评估。</text><text x="40" y="696" font-size="20" font-weight="400" fill="#172d43">知识读取：Provider / 源系统执行数据 ACL。</text><text x="40" y="737" font-size="20" font-weight="400" fill="#172d43">结果未知：进入对账；重试遵循动作幂等语义。</text><text x="40" y="778" font-size="20" font-weight="400" fill="#172d43">运行成功与业务验收分别记录。</text></g></svg>
