<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc">
<title id="title">部署演进：逻辑边界稳定，运行规模可扩展</title><desc id="desc">目标部署 · 单机用于起步验证；企业形态同时覆盖计算节点和共享依赖的故障域。</desc>
<defs><marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="9" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#56748f"/></marker></defs>
<rect width="1280" height="880" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="40" y="46" font-size="28" font-weight="700" fill="#172d43">部署演进：逻辑边界稳定，运行规模可扩展</text><text x="40" y="79" font-size="18" font-weight="400" fill="#476078">目标部署 · 单机用于起步验证；企业形态同时覆盖计算节点和共享依赖的故障域。</text><rect x="40" y="125" width="470" height="630" rx="10" fill="#fafcfe" stroke="#56748f" stroke-width="1.5"/><text x="62" y="161" font-size="25" font-weight="650" fill="#172d43">初期 · 模块化开发验证</text><rect x="65" y="205" width="420" height="105" rx="10" fill="#f1f6fa" stroke="#56748f" stroke-width="1.5"/><text x="87" y="241" font-size="22" font-weight="650" fill="#172d43">应用与数字员工服务</text><text x="87" y="274" font-size="19" font-weight="400" fill="#476078">同仓库 / 可同进程</text><rect x="65" y="365" width="420" height="105" rx="10" fill="#f1f6fa" stroke="#56748f" stroke-width="1.5"/><text x="87" y="401" font-size="22" font-weight="650" fill="#172d43">DiOS 内核与 Worker</text><text x="87" y="434" font-size="19" font-weight="400" fill="#476078">持久任务、授权、隔离</text><rect x="65" y="530" width="420" height="135" rx="10" fill="#f1f6fa" stroke="#56748f" stroke-width="1.5"/><text x="87" y="566" font-size="22" font-weight="650" fill="#172d43">持久数据与备份</text><text x="87" y="599" font-size="19" font-weight="400" fill="#476078">数据库 / 任务状态 / 产物</text><text x="87" y="628" font-size="19" font-weight="400" fill="#476078">明确路径与恢复边界</text><path d="M275 310 V365" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M275 470 V530" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="560" y="125" width="680" height="630" rx="10" fill="#fafcfe" stroke="#56748f" stroke-width="1.5"/><text x="582" y="161" font-size="25" font-weight="650" fill="#172d43">企业 · 多节点与高可用</text><rect x="590" y="205" width="620" height="105" rx="10" fill="#f1f6fa" stroke="#56748f" stroke-width="1.5"/><text x="612" y="241" font-size="22" font-weight="650" fill="#172d43">应用 / 服务 / 内核 API 多副本</text><text x="612" y="274" font-size="19" font-weight="400" fill="#476078">共享授权状态；负载分配与独立故障恢复</text><rect x="590" y="385" width="250" height="105" rx="10" fill="#f1f6fa" stroke="#56748f" stroke-width="1.5"/><text x="612" y="421" font-size="22" font-weight="650" fill="#172d43">持久队列与租约</text><text x="612" y="454" font-size="19" font-weight="400" fill="#476078">调度与状态协调</text><rect x="920" y="385" width="290" height="105" rx="10" fill="#f1f6fa" stroke="#56748f" stroke-width="1.5"/><text x="942" y="421" font-size="22" font-weight="650" fill="#172d43">Worker 池</text><text x="942" y="454" font-size="19" font-weight="400" fill="#476078">按负载与隔离扩展</text><path d="M715 310 V385" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="730" y="356" font-size="18" font-weight="500" fill="#476078">调度</text><path d="M840 437 H920" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="590" y="570" width="620" height="135" rx="10" fill="#f1f6fa" stroke="#56748f" stroke-width="1.5"/><text x="612" y="606" font-size="22" font-weight="650" fill="#172d43">共享持久服务与依赖</text><text x="612" y="639" font-size="19" font-weight="400" fill="#476078">数据库 / 对象存储 / Secret / 身份源</text><text x="612" y="668" font-size="19" font-weight="400" fill="#476078">各自的复制、备份、故障切换与恢复目标</text><path d="M715 490 V570" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1065 490 V570" fill="none" stroke="#56748f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="40" y="807" font-size="21" font-weight="400" fill="#172d43">验收：容量、排队时延、恢复时间、数据恢复点、滚动升级与单位工作成本。</text><text x="40" y="844" font-size="18" font-weight="400" fill="#476078">图示仅保留部署主关系；API 也访问状态服务。具体拓扑与选型由容量和故障模型确定。</text></g></svg>
