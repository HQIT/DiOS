<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">DiOS 工作流程</title>
  <desc id="desc">外部事件进入 DiOS，经过标准化、订阅路由和治理后，驱动隔离的 DiAgent 执行并留下结果与审计记录。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4667d9"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172033; }
      .label { font: 600 18px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4b5875; }
      .box { fill: #ffffff; stroke: #8a98b8; stroke-width: 2; rx: 12; }
      .core { fill: #f2f6ff; stroke: #4667d9; stroke-width: 3; rx: 16; }
      .flow { fill: none; stroke: #4667d9; stroke-width: 3; marker-end: url(#arrow); }
      .audit { fill: none; stroke: #70809f; stroke-width: 2; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#ffffff" rx="18"/>
  <text x="600" y="42" text-anchor="middle" class="title">事件进入，Agent 执行，全程可管可查</text>

  <text x="130" y="86" text-anchor="middle" class="small">事件来源</text>
  <rect x="35" y="108" width="190" height="58" class="box"/>
  <text x="130" y="143" text-anchor="middle" class="label">Git Webhook</text>
  <rect x="35" y="181" width="190" height="58" class="box"/>
  <text x="130" y="216" text-anchor="middle" class="label">Email / HTTP</text>
  <rect x="35" y="254" width="190" height="58" class="box"/>
  <text x="130" y="289" text-anchor="middle" class="label">Cron / Manual</text>

  <path d="M225 137 H280 V210 H335" class="flow"/>
  <path d="M225 210 H335" class="flow"/>
  <path d="M225 283 H280 V210 H335" class="flow"/>

  <rect x="340" y="95" width="350" height="230" class="core"/>
  <text x="515" y="135" text-anchor="middle" class="title">DiOS</text>
  <line x1="380" y1="154" x2="650" y2="154" stroke="#b7c3df" stroke-width="1.5"/>
  <text x="515" y="188" text-anchor="middle" class="label">事件标准化与订阅路由</text>
  <text x="515" y="230" text-anchor="middle" class="label">模型 · MCP · Skills 管理</text>
  <text x="515" y="272" text-anchor="middle" class="label">工具授权 · 审批 · 审计</text>
  <text x="515" y="305" text-anchor="middle" class="small">单机控制平面</text>

  <path d="M690 210 H755" class="flow"/>

  <text x="860" y="86" text-anchor="middle" class="small">隔离执行</text>
  <rect x="760" y="108" width="200" height="78" class="box"/>
  <text x="860" y="142" text-anchor="middle" class="label">Service Agent</text>
  <text x="860" y="166" text-anchor="middle" class="small">常驻服务</text>
  <rect x="760" y="234" width="200" height="78" class="box"/>
  <text x="860" y="268" text-anchor="middle" class="label">Task Agent</text>
  <text x="860" y="292" text-anchor="middle" class="small">一次性任务</text>
  <path d="M755 210 H730 V147 H760" class="flow"/>
  <path d="M755 210 H730 V273 H760" class="flow"/>

  <path d="M960 147 H1010" class="flow"/>
  <path d="M960 273 H1010" class="flow"/>
  <rect x="1015" y="108" width="150" height="78" class="box"/>
  <text x="1090" y="142" text-anchor="middle" class="label">结果</text>
  <text x="1090" y="166" text-anchor="middle" class="small">消息 / 产物</text>
  <rect x="1015" y="234" width="150" height="78" class="box"/>
  <text x="1090" y="268" text-anchor="middle" class="label">记录</text>
  <text x="1090" y="292" text-anchor="middle" class="small">日志 / 审计</text>

  <path d="M1015 336 H515 V325" class="audit"/>
  <text x="760" y="363" text-anchor="middle" class="small">状态、用量和执行证据回传 DiOS</text>
</svg>
